[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quoridor"
version = "0.1.0"
description = "Quoridor Game Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "httpx",
    "playwright",
    "pytest",
    "torch",
    "numpy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "models*", "strategy*", "training*", "game_engine*", "search*", "adapters*"]
